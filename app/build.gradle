plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.jionego.WeChatMsgHook'

    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId = 'com.jionego.WeChatMsgHook'
        minSdk = 15
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compileOnly files('lib/XposedBridgeApi-54.jar')
    testImplementation 'junit:junit:4.13.2'
}
